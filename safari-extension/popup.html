<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
body{font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;width:310px;padding:14px;margin:0;color:#111}h3{margin:0 0 4px}.muted{color:#666;font-size:12px}.toggle{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-top:1px solid #eee;border-bottom:1px solid #eee;margin:12px 0}.switch{position:relative;width:52px;height:30px}.switch input{display:none}.slider{position:absolute;inset:0;background:#bbb;border-radius:20px}.slider:before{content:"";position:absolute;width:24px;height:24px;left:3px;top:3px;background:white;border-radius:50%;transition:.18s}.switch input:checked+.slider{background:#111}.switch input:checked+.slider:before{transform:translateX(22px)}label.field{display:block;margin:10px 0}input[type=text]{width:100%;box-sizing:border-box;padding:8px;border:1px solid #ccc;border-radius:7px}button{width:100%;padding:9px;border:0;border-radius:7px;background:#111;color:white;font-weight:600}.status{margin-top:10px;padding:8px;background:#f4f4f4;border-radius:7px;font-size:12px;line-height:1.4}.on{font-weight:700}
</style></head><body>
<h3>Instagram Live Scanner</h3><div class="muted">Collect profiles you encounter while scrolling instagram.com in Safari.</div>
<div class="toggle"><div><div class="on" id="stateLabel">Scanner OFF</div><div class="muted">Uploads automatically to Render</div></div><label class="switch"><input id="scanner" type="checkbox"><span class="slider"></span></label></div>
<label class="field">Render URL<input type="text" id="u" placeholder="https://your-app.onrender.com"></label>
<label class="field">Device ID<input type="text" id="d" placeholder="copy from web dashboard"></label>
<button id="save">Save connection</button>
<div class="status" id="s">Not connected.</div>
<script src="popup.js"></script></body></html>

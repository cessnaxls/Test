<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Instagram Profile Gallery + CLIP</title>
  <link rel="stylesheet" href="/static/app.css?v=clip-text-v1">
</head>
<body>
<main>
  <header class="top">
    <div>
      <h1>Instagram Profile Gallery</h1>
      <p>Scraped profile photos with CLIP text similarity search.</p>
    </div>
    <div class="stats">
      <div><b id="total">0</b><span>profiles</span></div>
      <div><b id="photos">0</b><span>photos</span></div>
      <div><b id="clipIndexed">0</b><span>CLIP indexed</span></div>
    </div>
  </header>

  <section class="clip-panel">
    <div class="clip-search-row">
      <input id="clipQuery" type="search" placeholder='Describe a photo: "red hair sunglasses", "beach", "man in suit"...'>
      <button id="clipSearch">Search all indexed photos</button>
      <select id="scoreSort" class="score-sort"><option value="desc">Highest similarity first</option><option value="asc">Lowest similarity first</option></select>
      <button id="showRecent" class="secondary">Recent</button>
    </div>

    <div class="clip-progress">
      <div class="clip-progress-track">
        <div id="clipProgressBar" class="clip-progress-bar"></div>
      </div>
      <div id="clipProgressText">CLIP indexing status loading…</div>
    </div>

    <div class="clip-actions">
      <button id="reindex" class="secondary">Reindex all photos</button>
      <span id="clipStatus"></span>
    </div>
  </section>

  <section class="controls">
    <input id="filter" type="search" placeholder="Filter visible usernames…">
    <label class="toggle">
      <input id="photosOnly" type="checkbox" checked>
      <span>Photos only</span>
    </label>
    <button id="refresh">Refresh</button>
    <button id="clear" class="danger">Clear all</button>
  </section>

  <p id="status" class="status">CLIP text build v1</p>

  <section id="gallery" class="gallery"></section>

  <div class="footer-actions">
    <button id="more">Load more</button>
  </div>
</main>

<script src="/static/gallery-clip-text-v1.js?v=20260908-1"></script>
</body>
</html>

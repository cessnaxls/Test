<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Instagram Profile Viewer</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
<main>
  <header>
    <div>
      <h1>Instagram Profile Viewer</h1>
      <p>Phase 1: scraper → Render → persistent profile display.</p>
    </div>
    <div class="count"><b id="total">0</b><span>profiles</span></div>
  </header>
  <section class="toolbar">
    <button id="refresh">Refresh</button>
    <button id="clear" class="danger">Clear all profiles</button>
    <span id="status"></span>
  </section>
  <section id="grid" class="grid"></section>
  <div class="load-row"><button id="more">Load more</button></div>
</main>
<script src="/static/app.js"></script>
</body>
</html>

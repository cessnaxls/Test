services:
  - type: web
    name: instagram-profile-search
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python prefetch_clip.py
    startCommand: gunicorn -k uvicorn.workers.UvicornWorker -w 1 -b 0.0.0.0:$PORT server:app
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: HF_HOME
        value: /opt/render/project/src/.hf
      - key: CLIP_ONNX_REPO
        value: sayantan47/clip-vit-b32-onnx
      - key: CLIP_ONNX_FILE
        value: onnx/model_quantized.onnx
      - key: CLIP_BATCH_SIZE
        value: "32"
      - key: AVATAR_DOWNLOAD_WORKERS
        value: "32"
      - key: CLIP_INTRA_THREADS
        value: "4"
      - key: INDEX_POLL_SECONDS
        value: "0.15"
      - key: INGEST_MAX_BATCH
        value: "1000"

services:
  - type: web
    name: instagram-profile-search
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -k uvicorn.workers.UvicornWorker -w 1 -b 0.0.0.0:$PORT server:app
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: PROFILE_TABLE
        value: scraped_profiles_v2
      - key: CLIP_INDEX_WORKERS
        value: "16"
      - key: CLIP_BATCH_SIZE
        value: "64"
      - key: CLIP_POLL_SECONDS
        value: "0.15"
      - key: GPU_TIMEOUT_SECONDS
        value: "90"

services:
  - type: web
    name: instagram-profile-search
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -k uvicorn.workers.UvicornWorker -w 1 -b 0.0.0.0:$PORT server:app
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: CLIP_BATCH_SIZE
        value: "64"
      - key: AVATAR_DOWNLOAD_WORKERS
        value: "16"
      - key: INDEX_POLL_SECONDS
        value: "0.1"
      - key: INGEST_MAX_BATCH
        value: "1000"
      - key: REPLICATE_MODEL
        value: negu63/tinyclip
      - key: REPLICATE_CONCURRENCY
        value: "12"
      - key: REPLICATE_WAIT_SECONDS
        value: "60"

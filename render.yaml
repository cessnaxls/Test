services:
  - type: web
    name: instagram-profile-search
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -k uvicorn.workers.UvicornWorker -w 1 -b 0.0.0.0:$PORT server:app
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: HF_HOME
        value: /tmp/hf
      - key: CLIP_ONNX_REPO
        value: onnx-community/clip-vit-base-patch32-ONNX
      - key: CLIP_PROCESSOR_REPO
        value: openai/clip-vit-base-patch32
      - key: CLIP_ONNX_FILE
        value: onnx/model_quantized.onnx
      - key: CLIP_INDEX_WORKERS
        value: "2"
      - key: CLIP_WORKER_BATCH_SIZE
        value: "16"
      - key: CLIP_WORKER_DOWNLOADS
        value: "8"
      - key: CLIP_INTRA_THREADS
        value: "2"
      - key: INDEX_POLL_SECONDS
        value: "0.1"
      - key: INGEST_MAX_BATCH
        value: "1000"
